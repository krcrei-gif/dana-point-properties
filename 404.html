<style>
/* Layout idea: a harbor-chart band up top (depth contours, coordinates), then quiet
   single-column reading sections on fog, with lantern amber used only for marks and links. */
:root{
  --bg:#f2f5f5;
  --surface:#ffffff;
  --ink:#10262d;
  --muted:#52666c;
  --line:#cdd8d9;
  --accent:#8f5c0d;
  --harbor:#0e2f38;
  --harbor-ink:#eef4f3;
  --harbor-muted:#a9c0c2;
  --lantern:#e3a94a;
  --display:"Marcellus","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1b20;--surface:#10272e;--ink:#e9f0ef;--muted:#9fb3b6;--line:#25424a;
    --accent:#e3a94a;--harbor:#123943;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1b20;--surface:#10272e;--ink:#e9f0ef;--muted:#9fb3b6;--line:#25424a;
  --accent:#e3a94a;--harbor:#123943;color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--lantern);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(2.3rem,7vw,4.2rem);line-height:1.05;letter-spacing:.005em}
h2{font-size:clamp(1.6rem,4.2vw,2.3rem);line-height:1.15}
h3{font-size:1.25rem;line-height:1.25}
p{margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
.measure{max-width:62ch}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600}

.draftbar{background:var(--surface);border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.draftbar .wrap{padding-top:9px;padding-bottom:9px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.todo{border:1px dashed var(--accent);color:var(--accent);padding:1px 7px;border-radius:3px;font-size:.88em}

.harbor{background:linear-gradient(90deg,rgba(9,34,41,.90) 0%,rgba(9,34,41,.78) 55%,rgba(9,34,41,.62) 100%),image-set(url(img/dana-point-harbor.webp) type("image/webp"),url(img/dana-point-harbor.jpg) type("image/jpeg")) center 45%/cover no-repeat,var(--harbor);color:var(--harbor-ink);position:relative;overflow:hidden}
@media (max-width:760px){.harbor{background:linear-gradient(rgba(9,34,41,.84),rgba(9,34,41,.84)),image-set(url(img/dana-point-harbor.webp) type("image/webp"),url(img/dana-point-harbor.jpg) type("image/jpeg")) center 45%/cover no-repeat,var(--harbor)}}
.portrait{width:220px;max-width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;border:1px solid var(--line)}
.num{white-space:nowrap}
.deals li{display:flex;flex-direction:column;gap:6px}
.deals strong{font-weight:600}
.card .view{border-top:1px solid var(--line);padding-top:12px}
.card .view strong{color:var(--accent);font-weight:600}
.harbor canvas{position:absolute;inset:0;width:100%;height:100%}
.harbor .wrap{position:relative}
nav{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding:22px 0}
nav .brand{font-family:var(--display);font-size:1.2rem;color:var(--harbor-ink);text-decoration:none}
nav .links{display:flex;gap:22px;flex-wrap:wrap}
nav .links a{color:var(--harbor-muted);text-decoration:none;font-size:.95rem;font-weight:500;padding-bottom:3px;border-bottom:1px solid transparent}
nav .links a:hover,nav .links a[aria-current="page"]{color:var(--harbor-ink);border-bottom-color:var(--lantern)}
.hero{padding:56px 0 72px;display:flex;flex-direction:column;gap:22px}
.hero .eyebrow{color:var(--lantern)}
.hero p.lede{font-size:1.15rem;color:var(--harbor-ink);max-width:54ch}
.hero p.by{color:var(--harbor-muted);font-size:.98rem}
.btn{display:inline-block;align-self:flex-start;background:var(--lantern);color:#1b1608;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:2px}
.btn:hover{filter:brightness(1.06)}

section{padding:64px 0;border-bottom:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:20px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:28px 56px}
@media (max-width:760px){.split{grid-template-columns:1fr}section{padding:48px 0}}
.muted{color:var(--muted)}
ul.marks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.marks li{padding:15px 0 15px 26px;border-top:1px solid var(--line);position:relative}
ul.marks li:last-child{border-bottom:1px solid var(--line)}
ul.marks li::before{content:"";position:absolute;left:0;top:1.55em;width:14px;height:2px;background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);padding:26px;display:flex;flex-direction:column;gap:12px}
.contact dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 20px}
.contact dt{color:var(--muted);font-size:.9rem}
.contact dd{margin:0;overflow-wrap:anywhere}

.tablebox{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:820px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);font-size:.95rem}
th{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.empty{color:var(--accent)}
.districts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.src{font-size:.82rem;color:var(--muted)}
footer{padding:36px 0 56px;font-size:.88rem;color:var(--muted)}
footer .wrap{display:flex;flex-direction:column;gap:8px}
[hidden]{display:none !important}
</style>

    </div>

</header>
